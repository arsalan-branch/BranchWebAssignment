<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Web SDK Demo</title>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Let's see the og tags updated">
    <meta property="og:description" content="Testing the updation of og tags">
    <meta property="og:url" content="https://example.com/branch-web-sdk-demo">
    <meta property="og:type" content="ogtest">
    <meta property="og:site_name" content="Branch Web SDK Demo">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/ua-parser-js/dist/ua-parser.min.js"></script>

    <style>
        /* Minimal styling for the fingerprint box (safe to remove if styles.css already covers this) */
        .fingerprint-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            max-width: 600px;
            font-family: monospace;
        }

        #fingerprint-id-text {
            user-select: all;         /* makes the text easily selectable/copiable */
            word-break: break-all;
            flex: 1;
        }

        #copy-fingerprint-btn {
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #999;
            background: #f5f5f5;
        }

        #copy-fingerprint-btn:hover {
            background: #e9e9e9;
        }

        .copy-feedback {
            font-size: 12px;
            color: green;
            margin-left: 6px;
        }
    </style>
</head>

<body>
    <h1>Branch Web SDK Integration</h1>
    <div class="button-container">
        <button id="branch-link">Create Branch Link</button>
        <button id="custom-event">Trigger Custom Event</button>
        <button id="s2s-event">Trigger S2S Purchase</button>
        <a href="dogsapp://some/path">Open App</a>
    </div>

    <h2>Browser Fingerprint ID</h2>
    <!--
        Reference: https://help.branch.io/developer-hub/docs/web-full-reference#getbrowserfingerprintid
        branch.getBrowserFingerprintId(callback) returns a unique identifier for the browser,
        which persists across sessions unless cookies/local storage are cleared.
    -->
    <div class="fingerprint-box">
        <span id="fingerprint-id-text">Loading Browser Fingerprint ID...</span>
        <button id="copy-fingerprint-btn">Copy</button>
        <span class="copy-feedback" id="copy-feedback" style="display:none;">Copied!</span>
    </div>

    <h2>Has App (from branch.init)</h2>
    <!--
        Reference: https://help.branch.io/developer-hub/docs/web-full-reference#init
        The `data` object passed to the branch.init() callback includes a `has_app` boolean
        field, indicating whether the current user already has the app installed.
    -->
    <div class="fingerprint-box">
        <span id="has-app-text">Loading has_app status...</span>
        <button id="copy-has-app-btn">Copy</button>
        <span class="copy-feedback" id="copy-has-app-feedback" style="display:none;">Copied!</span>
    </div>


    <h2>Branch Quick Link Reader</h2>
    <div class="data-box" id="quick-link-data">
        Loading Branch link data...
    </div>

    <!--
        NOTE: The old inline script here used to run `window.location = 'dogsapp://some/path'`
        immediately and synchronously on page load. On mobile browsers (e.g. iOS Safari), assigning
        window.location to an unrecognized custom URL scheme is treated as a real navigation
        attempt and can abort/interrupt the current page load — which was preventing the Branch
        SDK script (loaded further down) from ever executing. That's why cdn.branch.io never
        showed up in the network log.

        The deep link is still available via the "Open App" link in the button-container above,
        which only fires on a user click (safe) instead of automatically on page load (unsafe).
        If you need an automatic app-open-with-fallback flow, do it AFTER Branch has initialized,
        and prefer a hidden iframe or a delayed location change over an immediate top-level
        window.location assignment.
    -->

    <script>
        // Fallback: if Branch SDK / fingerprint hasn't loaded within 6s, show a diagnostic message
        // instead of leaving the UI stuck on "Loading...". This usually means cdn.branch.io or
        // api2.branch.io was blocked (ad-blocker, tracking protection, or corporate firewall).
        setTimeout(function () {
            const fpTextEl = document.getElementById('fingerprint-id-text');
            if (fpTextEl && fpTextEl.innerText.indexOf('Loading') === 0) {
                fpTextEl.innerText = 'Timed out. Branch SDK may be blocked by an ad-blocker/tracking protection, or the browser is offline. Check the console/network tab for blocked requests to cdn.branch.io or api2.branch.io.';
                console.warn('Branch Fingerprint ID did not resolve within 6s — check for blocked network requests to cdn.branch.io / api2.branch.io.');
            }
            const hasAppTextEl = document.getElementById('has-app-text');
            if (hasAppTextEl && hasAppTextEl.innerText.indexOf('Loading') === 0) {
                hasAppTextEl.innerText = 'Timed out waiting for branch.init(). Check console/network tab.';
                console.warn('has_app did not resolve within 6s — branch.init() callback likely never fired.');
            }
        }, 6000);

        // Load Branch Web SDK
        (function (b, r, a, n, c, h, _, s, d, k) { if (!b[n] || !b[n]._q) { for (; s < _.length;)c(h, _[s++]); d = r.createElement(a); d.async = 1; d.src = "https://cdn.branch.io/branch-latest.min.js"; k = r.getElementsByTagName(a)[0]; k.parentNode.insertBefore(d, k); b[n] = h } })(window, document, "script", "branch", function (b, r) { b[r] = function () { b._q.push([r, arguments]) } }, { _q: [], _v: 1 }, "addListener banner closeBanner closeJourney data deepview deepviewCta first init link logout removeListener setBranchViewData setIdentity track trackCommerceEvent logEvent disableTracking getBrowserFingerprintId crossPlatformIds lastAttributedTouchData setAPIResponseCallback qrCode setRequestMetaData setAPIUrl getAPIUrl setDMAParamsForEEA".split(" "), 0);

        // Initialize Branch
        branch.init('key_live_jveDhIVvDiCtfFUER6qYxkggEDerqp2j', function (err, data) {
            const hasAppTextEl = document.getElementById('has-app-text');

            if (err) {
                console.error('Branch initialization failed:', err);
                hasAppTextEl.innerText = 'Error: could not determine has_app (init failed).';
            } else {
                console.log('Branch initialized:', data);

                // ---- has_app: whether the current user already has the app installed ----
                // Reference: https://help.branch.io/developer-hub/docs/web-full-reference#init
                if (data && typeof data.has_app !== 'undefined') {
                    console.log('has_app:', data.has_app);
                    hasAppTextEl.innerText = String(data.has_app);
                } else {
                    console.warn('has_app field not present in init callback data.');
                    hasAppTextEl.innerText = 'has_app not present in response.';
                }

                // Check if the data object is present
                if (data) {
                    console.log('Data is present:', data);

                    // Parse the JSON string in the `data` property
                    try {
                        var parsedData = JSON.parse(data.data);

                        // Check if `+clicked_branch_link` is present and truthy
                        if (parsedData['+clicked_branch_link']) {
                            console.log('Branch link was clicked:', parsedData['+clicked_branch_link']);

                            // Display the parsed data
                            document.getElementById('quick-link-data').innerHTML = `<pre>${JSON.stringify(parsedData, null, 2)}</pre>`;
                        } else {
                            console.log('Branch link not clicked.');
                            document.getElementById('quick-link-data').innerText = 'No Branch link data found.';
                        }
                    } catch (e) {
                        console.error('Error parsing data:', e);
                        document.getElementById('quick-link-data').innerText = 'Error parsing Branch link data.';
                    }
                } else {
                    console.log('No data received.');
                    document.getElementById('quick-link-data').innerText = 'No data received.';
                }
            }

            // ---- Fetch and display the Browser Fingerprint ID ----
            // Docs: https://help.branch.io/developer-hub/docs/web-full-reference#getbrowserfingerprintid
            console.log('branch.init callback fired, requesting fingerprint ID...');
            try {
                branch.getBrowserFingerprintId(function (fpErr, browserFingerprintId) {
                    const fpTextEl = document.getElementById('fingerprint-id-text');
                    if (fpErr) {
                        console.error('Error getting browser fingerprint ID:', fpErr);
                        fpTextEl.innerText = 'Error retrieving Browser Fingerprint ID: ' + (fpErr.message || JSON.stringify(fpErr));
                    } else if (!browserFingerprintId) {
                        console.warn('getBrowserFingerprintId returned no value.');
                        fpTextEl.innerText = 'No Browser Fingerprint ID returned by SDK.';
                    } else {
                        console.log('Browser Fingerprint ID:', browserFingerprintId);
                        fpTextEl.innerText = browserFingerprintId;
                    }
                });
            } catch (fpException) {
                console.error('Exception calling getBrowserFingerprintId:', fpException);
                document.getElementById('fingerprint-id-text').innerText = 'Exception calling getBrowserFingerprintId — see console.';
            }
        });

        // branch.init( 'key_live_jAozxBAhXn9NYeOS8Vj8BefnDxdempwR', {‘tracking_disabled’ : false});


        // Example: Create a Branch link on button click
        document.getElementById('branch-link').addEventListener('click', function () {
            branch.link({
                tags: ['tag1', 'tag2'],
                channel: 'website',
                feature: 'create-link',
                stage: 'new user',
                data: {
                    mydata: 'something',
                    foo: 'bar',
                    '$desktop_url': 'https://example.com',
                    '$ios_url': 'https://example.com/ios',
                    '$android_url': 'https://example.com/android'
                }
            }, function (err, link) {
                if (err) {
                    console.error('Failed to create link:', err);
                } else {
                    console.log('Branch link created:', link);
                    alert('Branch link created: ' + link);
                }
            });
        });


        // Example: Trigger a custom event on button click
        document.getElementById('custom-event').addEventListener('click', function () {
            // Define custom event data
            var customData = {
                "Custom_Event_Property_Key1": "Custom_Event_Property_val1",
                "Custom_Event_Property_Key2": "Custom_Event_Property_val2"
            };

            // Log custom event
            branch.logEvent(
                'custom_event_name',
                customData,
                function (err) {
                    if (err) {
                        console.error('Failed to log custom event:', err);
                    } else {
                        console.log('Custom event logged successfully');
                    }
                }
            );
        });


        //S2S

        // Function to fetch the public IP address
        function getPublicIp() {
            return fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => data.ip)
                .catch(() => 'unknown');
        }

        // Function to send the purchase event
        function sendPurchaseEvent() {
            // Get the user agent from the browser
            const userAgent = navigator.userAgent;

            // Parse user agent to get OS and OS version
            const parser = new UAParser(userAgent);
            const os = parser.getOS().name;
            const osVersion = parser.getOS().version;

            // Get the public IP address
            getPublicIp().then(ip => {
                // Get browser fingerprint ID
                branch.getBrowserFingerprintId(function (err, browserFingerprintId) {
                    if (err) {
                        console.error('Error getting browser fingerprint ID:', err);
                        return;
                    }

                    // Define the event payload
                    const eventPayload = {
                        "name": "PURCHASE",
                        "customer_event_alias": "my custom alias",
                        "user_data": {
                            "os_version": osVersion,
                            "limit_ad_tracking": false,
                            "developer_identity": "user123",
                            "browser_fingerprint_id": browserFingerprintId,
                            "language": "en",
                            "ip": ip,
                            "local_ip": "192.168.1.2",
                            "app_version": "1.0.0", // Example static value
                            "user_agent": userAgent,
                            "os": os
                        },
                        "custom_data": {
                            "purchase_loc": "Palo Alto",
                            "store_pickup": "unavailable"
                        },
                        "event_data": {
                            "transaction_id": "trans_Id_1232343434",
                            "currency": "USD",
                            "revenue": 180.2,
                            "shipping": 10.5,
                            "tax": 13.5,
                            "coupon": "promo-1234",
                            "affiliation": "high_fi",
                            "description": "Preferred purchase",
                            "custom_param_1": "Parameter 1",
                            "custom_param_2": "Parameter 2",
                            "custom_param_3": "Parameter 3"
                        },
                        "content_items": [
                            {
                                "$content_schema": "COMMERCE_PRODUCT",
                                "$og_title": "Nike Shoe",
                                "$og_description": "Start loving your steps",
                                "$og_image_url": "http://example.com/img1.jpg",
                                "$canonical_identifier": "nike/1234",
                                "$publicly_indexable": false,
                                "$price": 101.2,
                                "$locally_indexable": true,
                                "$quantity": 1,
                                "$sku": "1101123445",
                                "$product_name": "Runner",
                                "$product_brand": "Nike",
                                "$product_category": "Sporting Goods",
                                "$product_variant": "XL",
                                "$rating_average": 4.2,
                                "$rating_count": 5,
                                "$rating_max": 2.2,
                                "$creation_timestamp": 1499892854966,
                                "$exp_date": 1499892854966,
                                "$keywords": ["sneakers", "shoes"],
                                "$address_street": "230 South LaSalle Street",
                                "$address_city": "Chicago",
                                "$address_region": "IL",
                                "$address_country": "US",
                                "$address_postal_code": "60604",
                                "$latitude": 12.07,
                                "$longitude": -97.5,
                                "$image_captions": ["my_img_caption1", "my_img_caption_2"],
                                "$condition": "NEW",
                                "$custom_fields": "{\"foo1\":\"bar1\",\"foo2\":\"bar2\"}"
                            },
                            {
                                "$og_title": "Nike Woolen Sox",
                                "$canonical_identifier": "nike/5324",
                                "$og_description": "Fine combed woolen sox for those who love your foot",
                                "$publicly_indexable": false,
                                "$price": 80.2,
                                "$locally_indexable": true,
                                "$quantity": 5,
                                "$sku": "110112467",
                                "$product_name": "Woolen Sox",
                                "$product_brand": "Nike",
                                "$product_category": "Apparel & Accessories",
                                "$product_variant": "Xl",
                                "$rating_average": 3.3,
                                "$rating_count": 5,
                                "$rating_max": 2.8,
                                "$creation_timestamp": 1499892854966
                            }
                        ],
                        "metadata": {},
                        "branch_key": "key_live_jAozxBAhXn9NYeOS8Vj8BefnDxdempwR"
                    };

                    // Send the request
                    fetch('https://api2.branch.io/v2/event/standard', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(eventPayload)
                    })
                        .then(response => response.json())
                        .then(data => {
                            console.log('Event successfully sent:', data);
                        })
                        .catch((error) => {
                            console.error('Error sending event:', error);
                        });
                });
            });
        }


        // Example usage: Trigger the event when a button is clicked
        document.getElementById('s2s-event').addEventListener('click', sendPurchaseEvent);


        // ---- Copy Browser Fingerprint ID to clipboard ----
        document.getElementById('copy-fingerprint-btn').addEventListener('click', function () {
            const fpText = document.getElementById('fingerprint-id-text').innerText;
            const feedbackEl = document.getElementById('copy-feedback');

            function showCopiedFeedback() {
                feedbackEl.style.display = 'inline';
                setTimeout(() => { feedbackEl.style.display = 'none'; }, 1500);
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fpText)
                    .then(showCopiedFeedback)
                    .catch(err => console.error('Failed to copy:', err));
            } else {
                // Fallback for older browsers
                const tempInput = document.createElement('textarea');
                tempInput.value = fpText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showCopiedFeedback();
            }
        });

        // ---- Copy has_app status to clipboard ----
        document.getElementById('copy-has-app-btn').addEventListener('click', function () {
            const hasAppText = document.getElementById('has-app-text').innerText;
            const feedbackEl = document.getElementById('copy-has-app-feedback');

            function showCopiedFeedback() {
                feedbackEl.style.display = 'inline';
                setTimeout(() => { feedbackEl.style.display = 'none'; }, 1500);
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(hasAppText)
                    .then(showCopiedFeedback)
                    .catch(err => console.error('Failed to copy:', err));
            } else {
                const tempInput = document.createElement('textarea');
                tempInput.value = hasAppText;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                showCopiedFeedback();
            }
        });

    </script>
</body>

</html>
